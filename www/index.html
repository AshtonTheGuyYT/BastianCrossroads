<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Bastion Crossroads</title>
<meta name="description" content="Bastion Crossroads: one-on-one messaging with friends.">
<meta name="theme-color" content="#151A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crossroads">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151A22;--panel:#1B212B;--raised:#252D39;--line:#313B49;--text:#ECE6D8;--muted:#97A1AE;
  --accent:#E9B44C;--accent-ink:#1D1404;--danger:#E5604D;
  --st-online:#4FC27E;--st-idle:#E8B33F;--st-dnd:#E5534B;--st-offline:#7B8494;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --chat-fs:15px;--r-sm:6px;--r-md:10px;--r-lg:16px;
  --sidebar-w:320px;
  --soft:color-mix(in srgb,var(--accent) 15%,transparent);
  --hover:color-mix(in srgb,var(--text) 6%,transparent);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --pattern:none;--pattern-size:120px;--pattern-op:.06;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
#app{display:flex;height:100dvh;width:100%;position:relative;overflow:hidden;contain:paint}
#sidebar{width:var(--sidebar-w);flex:none;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;position:relative;z-index:1}
#chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg);min-height:0;overflow:hidden}

.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 10px;padding-top:calc(18px + var(--safe-t))}
.crest{width:32px;height:36px;color:var(--accent);flex:none}
.brand-name{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}

.side-tools{display:flex;gap:8px;padding:8px 14px 12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:0 11px;height:40px;color:var(--muted);transition:border-color .15s}
.search:focus-within{border-color:var(--accent);color:var(--text)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;height:100%;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search .ic{width:17px;height:17px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r-md);color:var(--muted);flex:none;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.solid{background:var(--accent);color:var(--accent-ink)}
.icon-btn.solid:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}

#convoList{flex:1;overflow-y:auto;padding:2px 8px 10px;overscroll-behavior:contain}
.list-label{font-size:12px;color:var(--muted);font-weight:600;padding:12px 10px 6px;display:flex;justify-content:space-between}
.convo{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:var(--r-md);position:relative}
.convo:hover{background:var(--hover)}
.convo.active{background:var(--raised)}
.convo.active::before{content:'';position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.convo-main{flex:1;min-width:0}
.convo-top{display:flex;align-items:baseline;gap:8px}
.convo-name{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-time{font-size:12px;color:var(--muted);flex:none}
.convo-bottom{display:flex;align-items:center;gap:8px;margin-top:1px}
.convo-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.convo-prev.typing{color:var(--accent)}
.convo.unread .convo-name,.convo.unread .convo-prev{color:var(--text)}
.convo.unread .convo-prev{font-weight:600}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px;flex:none}
.badge.ping{background:var(--danger);color:#fff}
.person-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-md)}
.person-row:hover{background:var(--hover)}
.person-row .who{flex:1;min-width:0}
.person-row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-row .who span{font-size:13px;color:var(--muted)}
.list-empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px}
.list-empty .btn{margin-top:12px}

#meBar{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-bottom:calc(8px + var(--safe-b));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 45%,var(--panel))}
.me-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px;border-radius:var(--r-md)}
.me-btn:hover{background:var(--hover)}
.me-btn .who{min-width:0}
.me-btn b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{width:8px;height:8px;border-radius:50%;background:var(--st-online);flex:none;margin-right:6px}
.conn.off{background:var(--danger);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- calls ---------- */
.call-ui{position:fixed;inset:0;z-index:95;background:radial-gradient(120% 90% at 50% 20%,color-mix(in srgb,var(--accent) 22%,var(--panel)),var(--bg));display:flex;flex-direction:column;animation:fade .2s}
.call-stage{flex:1;position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}
#callRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.call-who{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px}
.call-who .av{--s:112px!important;margin-bottom:6px}
.call-ui[data-state=incoming] .call-who .av,.call-ui[data-state=outgoing] .call-who .av{animation:callPulse 1.6s ease-in-out infinite}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);border-radius:50%}50%{box-shadow:0 0 0 18px transparent;border-radius:50%}}
.call-who b{font-family:var(--font-display);font-size:28px;font-weight:600}
.call-who span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.call-ui.has-remote .call-who{position:absolute;top:calc(16px + var(--safe-t));left:16px;align-items:flex-start;padding:10px 14px;background:rgba(0,0,0,.4);border-radius:var(--r-md);backdrop-filter:blur(8px)}
.call-ui.has-remote .call-who b{font-size:17px;color:#fff}.call-ui.has-remote .call-who span{color:#ddd;font-size:13px}
#callLocal{position:absolute;right:16px;bottom:16px;width:min(26vw,220px);aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-lg);border:2px solid rgba(255,255,255,.25);background:#000;z-index:2;transform:scaleX(-1);box-shadow:var(--shadow)}
.call-ui:not(.has-remote) #callLocal{width:min(34vw,260px)}
.call-controls{display:flex;justify-content:center;gap:14px;padding:18px 16px;padding-bottom:calc(22px + var(--safe-b));flex-wrap:wrap}
.call-btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text);min-width:64px}
.call-btn .ic{width:58px;height:58px;padding:16px;border-radius:50%;background:var(--raised);border:1px solid var(--line);box-sizing:border-box;transition:transform .1s}
.call-btn:active .ic{transform:scale(.93)}
.call-btn.off .ic{background:var(--text);color:var(--bg)}
.call-btn.end .ic{background:#E5484D;color:#fff;border-color:transparent}
.call-btn.ok .ic{background:#2FB566;color:#fff;border-color:transparent}
.call-log{display:flex;align-items:center;gap:10px;margin:10px 18px 4px 66px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-md);font-size:14px;width:fit-content;max-width:calc(100% - 84px)}
.call-log .ic{color:#2FB566}.call-log.missed .ic{color:#E5484D}.call-log.missed b{color:#E5484D}
.call-log time{color:var(--muted);font-size:12px;margin-left:4px}
body.phone .call-log{margin-left:56px}
/* ---------- requests ---------- */
.list-tabs{display:flex;gap:4px;margin:0 14px 4px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md)}
.list-tabs button{flex:1;height:32px;border-radius:calc(var(--r-md) - 3px);font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.list-tabs button.on{background:var(--raised);color:var(--text)}
.list-tabs button:hover{color:var(--text)}
.req-count{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
.convo .req-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:1px 7px;flex:none}
.request-bar{position:relative;z-index:3;margin:0 16px 16px;margin-bottom:calc(14px + var(--safe-b));padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.request-bar h4{margin:0 0 4px;font-size:15px}
.request-bar p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.request-bar .row .btn{flex:1;min-width:100px}
/* ---------- avatars ---------- */
.av{position:relative;flex:none;width:var(--s,40px);height:var(--s,40px);display:block}
.av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s,40px) * .38);color:#fff;background:var(--c,#556);overflow:hidden;user-select:none;letter-spacing:-.02em}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:max(11px,calc(var(--s,40px) * .3));height:max(11px,calc(var(--s,40px) * .3));border-radius:50%;border:3px solid var(--ring,var(--panel));background:var(--st-offline)}
.dot.st-online{background:var(--st-online)}.dot.st-idle{background:var(--st-idle)}.dot.st-dnd{background:var(--st-dnd)}.dot.st-offline,.dot.st-invisible{background:var(--st-offline)}
.dot.st-invisible{background:transparent;box-shadow:inset 0 0 0 3px var(--st-offline)}

/* ---------- chat ---------- */
.chat-bg{position:absolute;inset:0;background-image:var(--pattern);background-size:var(--pattern-size);opacity:var(--pattern-op);pointer-events:none;z-index:0}
#chatView{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;z-index:1}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + var(--safe-t));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-height:62px;position:relative;z-index:3}
.back-btn{display:none}
.head-who{display:flex;align-items:center;gap:11px;min-width:0;flex:1;padding:4px 6px;border-radius:var(--r-md)}
.head-who:hover{background:var(--hover)}
.head-who .av{--ring:var(--panel)}
.head-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.head-status{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.head-text{min-width:0}

#messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 0 10px;overscroll-behavior:contain;position:relative}
.intro{padding:28px 20px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.intro h2{font-family:var(--font-display);font-size:28px;font-weight:600;margin:6px 0 0;line-height:1.15}
.intro p{margin:0;color:var(--muted);max-width:56ch}
.intro .av{--ring:var(--bg)}
.day{display:flex;align-items:center;gap:12px;margin:22px 18px 6px;color:var(--muted);font-size:12px;font-weight:600}
.day::before,.day::after{content:'';flex:1;height:1px;background:var(--line)}

.msg{display:grid;grid-template-columns:58px minmax(0,1fr);padding:3px 18px 3px 8px;position:relative;margin-top:14px;transition:background .1s}
.msg.grouped{margin-top:0;padding-top:1px;padding-bottom:1px}
.msg:hover{background:var(--hover)}
.msg.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background:var(--soft)}100%{background:transparent}}
.msg-gutter{display:flex;justify-content:center;padding-top:2px}
.msg-gutter time{font-size:10.5px;color:var(--muted);opacity:0;padding-top:5px;white-space:nowrap}
.msg.grouped:hover .msg-gutter time{opacity:1}
.av-btn{border-radius:50%;display:block}
.msg-body{min-width:0}
.msg-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.msg-author{font-weight:700;font-size:15px}
.msg-author:hover{text-decoration:underline}
.msg.mine .msg-author{color:var(--accent)}
.msg-head time{font-size:12px;color:var(--muted)}
.msg-text{font-size:var(--chat-fs);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.msg-text.jumbo{font-size:44px;line-height:1.2}
.edited{font-size:11px;color:var(--muted);margin-left:5px}
.msg.mentioned{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.mention{background:var(--soft);color:var(--accent);padding:0 4px;border-radius:5px;font-weight:600;font-size:inherit}
.mention:hover{text-decoration:underline}
.mention.me{background:var(--accent);color:var(--accent-ink)}
.spoiler{background:var(--text);color:transparent;border-radius:4px;cursor:pointer;padding:0 2px;transition:all .15s}
.spoiler.open{background:var(--raised);color:inherit}
.msg-text code{font-family:var(--mono);font-size:.86em;background:var(--raised);padding:1px 5px;border-radius:4px}
.msg-text pre{background:var(--raised);border:1px solid var(--line);padding:10px 12px;border-radius:var(--r-sm);overflow-x:auto;margin:4px 0;white-space:pre;touch-action:pan-x pan-y!important}
.msg-text pre code{background:none;padding:0}
.msg-text a{word-break:break-all}
.reply-ref{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 3px;max-width:100%;min-width:0;position:relative}
.reply-ref::before{content:'';position:absolute;left:-36px;top:9px;width:30px;height:12px;border-left:2px solid var(--line);border-top:2px solid var(--line);border-top-left-radius:7px}
.reply-ref b{color:var(--text);font-weight:600;flex:none}
.reply-ref span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-ref:hover span{color:var(--text)}
.reply-ref .av{--s:16px}

.msg-tools{position:absolute;right:18px;top:-15px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:2px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:4}
.msg:hover .msg-tools,.msg:focus-within .msg-tools{display:flex}
.tool{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:17px;line-height:1}
.tool .ic{width:18px;height:18px}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.danger:hover{color:var(--danger)}
.tool-sep{width:1px;background:var(--line);margin:5px 2px}

.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.react{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:14px;background:var(--raised);border:1px solid transparent;font-size:15px;line-height:1;transition:transform .1s}
.react:active{transform:scale(.94)}
.react span{font-size:12px;font-weight:700;color:var(--muted)}
.react:hover{border-color:var(--line)}
.react.mine{background:var(--soft);border-color:var(--accent)}
.react.mine span{color:var(--accent)}
.react.add{opacity:0;color:var(--muted);padding:0 7px}
.react.add .ic{width:16px;height:16px}
.msg:hover .react.add{opacity:1}

.atts{display:flex;flex-direction:column;gap:6px;margin-top:6px;align-items:flex-start;max-width:100%}
.att-img{display:block;border-radius:var(--r-md);overflow:hidden;max-width:100%;background:var(--raised);position:relative}
.att-img img{display:block;width:100%;height:100%;object-fit:cover}
.att-vid{max-width:min(480px,100%);max-height:360px;border-radius:var(--r-md);background:#000;display:block}
.att-aud{width:min(360px,100%)}
.att-cap{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.att-cap a{color:var(--muted)}
.att-file{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);width:min(380px,100%)}
.att-file .fi{width:38px;height:44px;border-radius:6px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none;font-size:10px;font-weight:800;letter-spacing:.02em;position:relative}
.att-file .meta{flex:1;min-width:0}
.att-file b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.att-file span{font-size:12px;color:var(--muted)}
.att-missing{font-size:13px;color:var(--muted);font-style:italic}

#typing{height:22px;padding:0 20px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;position:relative;z-index:2}
#typing b{color:var(--text);font-weight:600}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}

.composer{position:relative;z-index:3;padding:0 16px 16px;padding-bottom:calc(14px + var(--safe-b))}
.composer-box{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .15s}
.composer-box:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.composer-row{display:flex;align-items:flex-end;gap:2px;padding:5px}
#input{flex:1;resize:none;border:0;background:none;outline:none;max-height:180px;min-height:40px;padding:9px 6px;line-height:1.45;font-size:var(--chat-fs);color:var(--text)}
#input::placeholder{color:var(--muted)}
.send-btn{background:var(--accent);color:var(--accent-ink)}
.send-btn:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.send-btn:disabled{opacity:.35;cursor:default;filter:none}
.reply-bar{display:flex;align-items:center;gap:8px;padding:8px 10px 0 14px;font-size:13px;color:var(--muted)}
.reply-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar b{color:var(--text)}
.reply-bar .icon-btn{width:28px;height:28px}
.tray{display:flex;gap:8px;padding:10px 10px 2px;overflow-x:auto}
.chip{position:relative;width:132px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:6px;font-size:12px}
.chip .thumb{height:78px;border-radius:7px;background:var(--bg) center/cover;display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:13px}
.chip b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.chip span{color:var(--muted)}
.chip .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center}
.chip .x .ic{width:14px;height:14px;stroke-width:2.5}
.chip .prog{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}

.ac{position:absolute;left:16px;right:16px;bottom:calc(100% - 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;z-index:10;max-height:280px;overflow-y:auto}
.ac-title{font-size:12px;color:var(--muted);font-weight:600;padding:4px 8px 6px}
.ac-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px}
.ac-item.sel,.ac-item:hover{background:var(--raised)}
.ac-item .em{font-size:22px;width:28px;text-align:center}
.ac-item small{color:var(--muted);margin-left:auto}

.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:var(--r-lg);background:color-mix(in srgb,var(--bg) 80%,transparent);z-index:20;display:grid;place-items:center;text-align:center;pointer-events:none;font-weight:600}
.drop small{display:block;color:var(--muted);font-weight:500;margin-top:4px}

.empty-chat{flex:1;display:grid;place-items:center;position:relative;z-index:1;text-align:center;padding:30px}
.empty-chat .crest{width:84px;height:94px;margin:0 auto 16px;opacity:.9}
.empty-chat h2{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0 0 8px}
.empty-chat p{color:var(--muted);margin:0 auto 20px;max-width:38ch}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;transition:filter .12s,background .12s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:var(--raised);color:var(--text);font-weight:600}
.btn.ghost:hover{background:color-mix(in srgb,var(--raised) 80%,var(--text))}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn .ic{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:42px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:none;color:var(--text);width:100%}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent)}
.inp:disabled{opacity:.6}
.at-inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding-left:12px;color:var(--muted)}
.at-inp:focus-within{border-color:var(--accent)}
.at-inp .inp{border:0;background:none;padding-left:3px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);min-height:18px}
.count{font-size:12px;color:var(--muted);text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .15s}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.toggle-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle-row .t{flex:1}
.toggle-row b{display:block;font-weight:600}
.toggle-row span{font-size:13px;color:var(--muted)}
.color-inp{width:42px;height:42px;border:1px solid var(--line);border-radius:var(--r-md);padding:3px;background:var(--bg);cursor:pointer}

/* ---------- custom emoji ---------- */
.emj{width:1.3em;height:1.3em;vertical-align:-.3em;margin:0 .04em;display:inline-block;object-fit:contain;filter:drop-shadow(0 0 .7px rgba(255,255,255,.28))}
body.light .emj{filter:none}
.msg-text.jumbo .emj{width:48px;height:48px;vertical-align:-10px;margin:2px 1px}
body.phone .msg-text.jumbo .emj{width:42px;height:42px}
.react .emj{width:19px;height:19px;vertical-align:middle;margin:0}
.tool .emj{width:20px;height:20px;margin:0}
.ep-items .emj{width:30px;height:30px;margin:0}
.ep-tabs .emj{width:20px;height:20px;margin:0}
.ep-foot .big .emj{width:26px;height:26px;margin:0;vertical-align:middle}
.ac-item .em .emj{width:24px;height:24px;margin:0}
.msheet .quick .emj{width:28px;height:28px;margin:0}
.ep-tabs button{filter:none;opacity:.65}
/* ---------- floating: popover / sheet / emoji ---------- */
.pop{position:fixed;z-index:50;width:320px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:popIn .16s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
.sheet-scrim{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pop.sheet,.emoji-panel.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-width:none;border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:var(--safe-b);animation:sheetUp .24s cubic-bezier(.2,.8,.2,1);max-height:88dvh;overflow-y:auto}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}

.pcard-banner{height:112px;background:var(--b,#334) center/cover}
.pcard-top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px;margin-top:-46px}
.pcard-top .av{--s:88px;--ring:var(--panel)}
.pcard-top .av-img{box-shadow:0 0 0 6px var(--panel)}
.pcard-top .av .dot{border-width:5px;right:2px;bottom:2px}
.pcard-body{padding:12px 16px 16px}
.pcard-name{font-family:var(--font-display);font-size:23px;font-weight:600;line-height:1.15;word-break:break-word}
.pcard-handle{color:var(--muted);font-size:14px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;background:var(--raised);border-radius:999px;padding:2px 9px;color:var(--text)}
.pcard-status{margin-top:10px;font-size:14px;padding:8px 11px;border-radius:var(--r-md);background:var(--raised);position:relative}
.pcard-status::before{content:'';position:absolute;top:-6px;left:22px;width:12px;height:12px;background:var(--raised);transform:rotate(45deg)}
.pcard-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pcard-sec h4{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}
.pcard-sec p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pcard-actions{display:flex;gap:8px;margin-top:16px}
.pcard-actions .btn{flex:1}
.status-menu{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.status-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13.5px;white-space:nowrap;min-width:0}
.status-opt .chk{display:none}
.status-opt:hover{background:var(--raised)}
.status-opt.sel{background:var(--raised);font-weight:600}
.status-opt .dot{position:static;width:12px;height:12px;border:0;border-radius:50%}
.status-opt .dot.st-invisible{box-shadow:inset 0 0 0 3px var(--st-offline)}

.msheet{padding:8px 12px 12px}
.msheet .quick{display:flex;justify-content:space-between;gap:6px;padding:10px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.msheet .quick button{width:46px;height:46px;border-radius:50%;background:var(--raised);font-size:23px;display:grid;place-items:center}
.msheet .quick button.on{box-shadow:inset 0 0 0 2px var(--accent)}
.msheet .act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 10px;border-radius:var(--r-md);font-size:15px;font-weight:500}
.msheet .act:hover{background:var(--raised)}
.msheet .act.danger{color:var(--danger)}

.emoji-panel{position:fixed;z-index:70;width:356px;max-width:calc(100vw - 16px);height:420px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:popIn .14s ease-out}
.emoji-panel.sheet{height:min(62dvh,460px);overflow:hidden}
.ep-top{padding:10px 10px 6px}
.ep-top .search{height:36px}
.ep-grid{flex:1;overflow-y:auto;padding:0 8px 8px}
.ep-cat{font-size:12px;font-weight:700;color:var(--muted);padding:9px 4px 4px;position:sticky;top:0;background:var(--panel);z-index:1}
.ep-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
.ep-items button{height:42px;border-radius:8px;display:grid;place-items:center;line-height:1}
.ep-items button:hover,.ep-items button:focus-visible{background:var(--raised)}
.ep-tabs{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:4px 6px}
.ep-tabs button{font-size:18px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;filter:grayscale(.7);opacity:.75}
.ep-tabs button:hover,.ep-tabs button.on{background:var(--raised);filter:none;opacity:1}
.ep-foot{padding:6px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);min-height:30px;display:flex;align-items:center;gap:8px}
.ep-foot .big{font-size:20px}
.ep-none{padding:30px 10px;text-align:center;color:var(--muted)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:min(460px,100%);max-height:calc(100dvh - 40px);overflow:auto;box-shadow:var(--shadow);animation:popIn .18s ease-out;position:relative}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.modal-head h3{flex:1;margin:0;font-family:var(--font-display);font-weight:600;font-size:22px}
.modal-body{padding:8px 20px 20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 35%,var(--panel))}

.settings{width:min(980px,100%);height:min(720px,calc(100dvh - 40px));display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden;padding:0}
.set-nav{background:color-mix(in srgb,var(--bg) 40%,var(--panel));border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.set-nav h3{font-family:var(--font-display);font-weight:600;font-size:21px;margin:2px 10px 14px}
.set-tab{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.set-tab .ic{width:18px;height:18px}
.set-tab:hover{background:var(--hover);color:var(--text)}
.set-tab.on{background:var(--raised);color:var(--text);font-weight:600}
.set-tab.danger{color:var(--danger)}
.set-main{overflow-y:auto;padding:24px 28px 28px;position:relative}
.set-main h2{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 4px}
.set-main>.hint{margin:0 0 22px;display:block}
.set-close{position:absolute;top:14px;right:14px;z-index:5;background:var(--panel)}
.set-section{margin:24px 0 10px;font-size:13px;font-weight:700;color:var(--muted)}
.prof-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.prof-preview{position:sticky;top:0}
.prof-preview .pop{position:static;width:100%;animation:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.img-row{display:flex;gap:8px;flex-wrap:wrap}
.save-bar{position:sticky;bottom:-28px;margin:20px -28px -28px;padding:12px 28px;background:var(--raised);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:4}
.save-bar span{flex:1;font-weight:600;font-size:14px}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.theme-card{border-radius:var(--r-md);border:2px solid var(--line);overflow:hidden;text-align:left;background:var(--bg);transition:border-color .12s,transform .12s}
.theme-card:hover{transform:translateY(-2px)}
.theme-card.on{border-color:var(--accent)}
.tc-prev{height:96px;position:relative;display:flex;overflow:hidden}
.tc-side{width:34%;padding:8px 6px;display:flex;flex-direction:column;gap:6px}
.tc-side i{height:8px;border-radius:4px;display:block;opacity:.75}
.tc-main{flex:1;position:relative;padding:10px 8px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.tc-main .pat{position:absolute;inset:0;background-size:78px}
.tc-main i{position:relative;height:9px;border-radius:5px;display:block}
.tc-label{padding:8px 10px;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);color:var(--text)}
.tc-label small{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:3px}
.seg button{padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text)}
input[type=range]{accent-color:var(--accent);width:240px}
.kbd{font-family:var(--mono);font-size:12px;background:var(--raised);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.info-list{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px}
.info-list dt{color:var(--muted)}
.info-list dd{margin:0}

.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:flex;flex-direction:column;animation:fade .15s}
.viewer-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + var(--safe-t));color:#fff}
.viewer-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.viewer-bar .icon-btn{color:#fff}
.viewer-img{flex:1;display:grid;place-items:center;padding:10px;min-height:0}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

#toasts{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:popIn .2s;max-width:100%}
.toast.bad{background:var(--danger);color:#fff}

.waking{position:fixed;left:50%;top:calc(24px + var(--safe-t));transform:translateX(-50%);z-index:120;width:min(420px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px 14px 62px;animation:popIn .2s;min-height:64px}
.waking .crest{position:absolute;left:16px;top:14px;width:32px;height:36px;animation:breathe 1.6s ease-in-out infinite}
.waking b{display:block}.waking span{display:block;font-size:13px;color:var(--muted)}
@keyframes breathe{50%{opacity:.45}}
/* ---------- onboarding ---------- */
#onboard{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px;overflow-y:auto}
#onboard .chat-bg{opacity:calc(var(--pattern-op) * 1.4)}
.ob-card{position:relative;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 28px 26px;box-shadow:var(--shadow)}
.ob-crest{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.ob-crest .crest{width:52px;height:58px}
.ob-crest h1{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.015em}
.ob-crest p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ob-switch{margin-top:16px;text-align:center;font-size:14px;color:var(--muted)}
.ob-switch button{color:var(--accent);font-weight:600}
.ob-switch button:hover{text-decoration:underline}

/* ---------- theme FX ---------- */
body[data-fx=scanlines] #chat::after,body[data-fx=scanlines] #sidebar::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
body[data-fx=scanlines] .msg-text,body[data-fx=scanlines] .brand-name{text-shadow:0 0 6px color-mix(in srgb,var(--accent) 55%,transparent)}
body[data-fx=glow] .brand-name,body[data-fx=glow] .head-name,body[data-fx=glow] .msg.mine .msg-author{text-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent)}
body[data-fx=glow] .composer-box:focus-within{box-shadow:0 0 0 1px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 30%,transparent)}
body[data-fx=glow] .crest{filter:drop-shadow(0 0 8px var(--accent))}
body[data-fx=hearts] .send-btn{border-radius:50%}

/* ---------- compact density ---------- */
body.compact .msg{margin-top:4px}
body.compact .msg.grouped{margin-top:0}
body.compact .msg-gutter .av{--s:28px!important}
body.compact .msg{grid-template-columns:46px minmax(0,1fr)}

/* ---------- phone mode ---------- */
body.phone #app{display:block}
body.phone #sidebar{position:absolute;inset:0;width:100%;border-right:0;transition:transform .34s cubic-bezier(.2,.8,.2,1),filter .34s;filter:brightness(var(--dim,1))}
body.phone #chat{position:absolute;inset:0;z-index:5;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 40px rgba(0,0,0,.45);visibility:hidden}
body.phone.chat-open #chat{transform:translateX(0);visibility:visible}
body.phone.chat-anim #chat{visibility:visible}
body.phone.chat-open #sidebar{transform:translateX(-22%);--dim:.5}
body.phone.dragging #chat,body.phone.dragging #sidebar{transition:none}
body.phone #chat,body.phone #chat *{touch-action:pan-y}
body.phone .back-btn{display:grid;margin-left:-6px}
body.phone .chat-head{padding-left:8px;min-height:58px}
body.phone .msg{padding-right:12px;padding-left:4px;grid-template-columns:52px minmax(0,1fr);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.phone .msg:hover{background:transparent}
body.phone .msg.mentioned{background:var(--soft)}
body.phone .msg.pressing{background:var(--hover)}
body.phone .msg-tools{display:none!important}
body.phone .react.add{opacity:1}
body.phone .composer{padding:0 10px 10px;padding-bottom:calc(10px + var(--safe-b))}
body.phone #input{font-size:16px}
body.phone .msg-text.jumbo{font-size:40px}
body.phone .edge-grip{display:block}
.edge-grip{display:none;position:absolute;left:0;top:50%;width:4px;height:56px;margin-top:-28px;border-radius:0 4px 4px 0;background:var(--line);z-index:6;pointer-events:none;opacity:.8}
body.phone .scrim{padding:0}
body.phone .modal{border-radius:20px 20px 0 0;align-self:end;max-height:92dvh;width:100%}
body.phone .settings{border-radius:0;height:100dvh;max-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-self:stretch}
body.phone .set-nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:10px;padding-top:calc(10px + var(--safe-t));overflow-x:auto;gap:4px}

/* =========================================================

const APP_VERSION = '2.0.0';
/* ---------------------------------------------------------

const DEFAULT_SERVER = '';

/* ---------- emoji data ---------- */
/* ---------- Bastion emoji (original art, see emoji-art.js) ----------
   Standard emoji are stored as normal characters so they still read correctly anywhere;
   Bastion originals use :shortcodes:. Both are drawn with our own art when shown. */
const BXE = window.BX_EMOJI || [];
const stripVS = k => k.replace(/️/g, '');
const EMO_BY_KEY = new Map(), EMO_BY_NAME = new Map();
for (const e of BXE) { EMO_BY_KEY.set(e.k, e); EMO_BY_KEY.set(stripVS(e.k), e); EMO_BY_NAME.set(e.n, e); }
const EMOJI_LIST = BXE.map(e => ({ e: e.k, n: e.n, kw: e.kw || '', c: e.c }));
const EMOJI_CATS = window.BX_EMOJI_CATS || [];
const EMOJI_CAT_ICON = { Recent: '🕘', Faces: '😀', Love: '❤️', Hands: '👋', Animals: '🐱', Food: '🍕', Nature: '🌸', Things: '🎁', Symbols: '✅', Bastion: ':bastion:' };
const emojiName = k => (EMO_BY_KEY.get(k) || EMO_BY_KEY.get(stripVS(k)) || {}).n || '';
const emoURLs = new Map();
function emoURL(e) { if (!emoURLs.has(e.k)) emoURLs.set(e.k, 'data:image/svg+xml,' + encodeURIComponent(e.svg)); return emoURLs.get(e.k); }
/** HTML for one emoji key (unicode or :shortcode:). Falls back to the plain character. */
function emoji(k, cls = 'emj') {
  const e = EMO_BY_KEY.get(k) || EMO_BY_KEY.get(stripVS(k)) || (/^:[a-z0-9_]+:$/.test(k) && EMO_BY_NAME.get(k.slice(1, -1)));
  return e ? `<img class="${cls}" src="${emoURL(e)}" alt="${esc(e.k)}" title=":${esc(e.n)}:" draggable="false">` : esc(k);
}
// one regex that finds every emoji we have art for (longest first, so ❤️‍🔥 wins over ❤️), plus :shortcodes:
const EMO_RE = (() => {
  const keys = [...new Set(BXE.filter(e => !e.k.startsWith(':')).flatMap(e => [e.k, stripVS(e.k)]))].sort((a, b) => b.length - a.length);
  return new RegExp('(' + keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')️?|:([a-z0-9_]{2,32}):', 'gu');
})();
/** Swap emoji for our art inside already-escaped HTML, touching only text (never inside tags). */
function emoText(html) {
  if (!BXE.length) return html;
  return String(html).split(/(<[^>]*>)/).map((part, i) => i % 2 ? part : part.replace(EMO_RE, (m, uni, name) => {
    if (name) { const e = EMO_BY_NAME.get(name); return e ? emoji(':' + name + ':') : m; }
    return emoji(uni);
  })).join('');
}
const emoEsc = s => emoText(esc(s));

/* ---------- format helpers ---------- */
function fmtSize(b) { if (!b && b !== 0) return ''; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i]; }
const dayKey = ts => new Date(ts).toDateString();
function timeOnly(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function relDay(ts) {
  const d = new Date(ts), n = new Date(); const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((b - a) / 864e5);
}
function timeFull(ts) { const r = relDay(ts); if (r === 0) return 'Today at ' + timeOnly(ts); if (r === 1) return 'Yesterday at ' + timeOnly(ts); return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + timeOnly(ts); }
function timeShort(ts) { const r = relDay(ts); if (r === 0) return timeOnly(ts); if (r === 1) return 'Yesterday'; if (r < 7) return new Date(ts).toLocaleDateString([], { weekday: 'short' }); return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' }); }
function dayLabel(ts) { const r = relDay(ts); if (r === 0) return 'Today'; if (r === 1) return 'Yesterday'; return new Date(ts).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: new Date(ts).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); }
function colorFor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 42% 46%)`; }
function initials(n) { const p = String(n || '?').trim().split(/\s+/); return ((p[0]?.[0] || '?') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }

/* =========================================================
   Local storage layer (IndexedDB with in-memory fallback)
   ========================================================= */
const DB = {
  db: null, mem: null,
  async open() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('bastion-crossroads', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); const m = d.createObjectStore('messages', { keyPath: 'id' }); m.createIndex('peer', 'peer'); d.createObjectStore('files'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
    } catch (e) { this.mem = { kv: new Map(), messages: new Map(), files: new Map() }; }
    return !this.mem;
  },
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _done(t) { return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Write aborted')); }); },
  async get(s, k) { if (this.mem) return this.mem[s].get(k); return this._req(this.db.transaction(s).objectStore(s).get(k)); },
  async all(s) { if (this.mem) return [...this.mem[s].values()]; return this._req(this.db.transaction(s).objectStore(s).getAll()); },
  async put(s, v, k) { if (this.mem) { this.mem[s].set(k ?? v.id, v); return; } const t = this.db.transaction(s, 'readwrite'); k === undefined ? t.objectStore(s).put(v) : t.objectStore(s).put(v, k); return this._done(t); },
  async del(s, k) { if (this.mem) { this.mem[s].delete(k); return; } const t = this.db.transaction(s, 'readwrite'); t.objectStore(s).delete(k); return this._done(t); },
  async wipe() { if (this.db) { this.db.close(); await new Promise(r => { const q = indexedDB.deleteDatabase('bastion-crossroads'); q.onsuccess = q.onerror = q.onblocked = () => r(); }); } }
};

/* =========================================================

   ========================================================= */

/* Free servers (like Render's free plan) fall asleep when idle and take up to a minute to wake.
   This pings until the server answers, showing a notice if it takes more than a moment. */
async function wakeServer(base) {
  const deadline = Date.now() + 120e3; let shown = null;
  const notice = setTimeout(() => { shown = showWaking(); }, 2500);
  try {
    while (true) {
      try {
        const c = new AbortController(), t = setTimeout(() => c.abort(), 10e3);
        const r = await fetch(base + '/api/ping', { cache: 'no-store', signal: c.signal }); clearTimeout(t);
        const j = await r.json().catch(() => null);
        if (r.ok && j?.app === 'bastion-crossroads') { S.serverInfo = j; return j; }
        if (r.status === 403 && j?.error) throw Object.assign(new Error(j.error + ' Add this app\'s address to ALLOWED_ORIGINS on the server.'), { final: true });
      } catch (e) { if (e.final) throw e; }
      if (Date.now() > deadline) throw new Error('The server at ' + base + ' did not answer. Check the address, or try again in a minute.');
      await sleep(2500);
    }
  } finally { clearTimeout(notice); shown?.remove(); }
}
function showWaking() {
  const el = document.createElement('div'); el.className = 'waking'; el.setAttribute('role', 'status');
  el.innerHTML = `<svg class="crest" aria-hidden="true"><use href="#crest"/></svg><b>Waking up the server…</b><span>Free servers take a nap when nobody is around. This can take up to a minute.</span>`;
  document.body.append(el); return el;
}

/* ---------- events from backends ---------- */
function emit(e) { try { onEvent(e); } catch (err) { console.error(err); } }
function loadSnapshot(d) {

  S.contacts = [...(d.contacts || [])];
  S.msgs = new Map();

      renderList(); renderMe(); if (S.active) { renderHead(); if (u.id === S.active || u.id === S.me.id) renderMessages(); }

/* ---------- unread / notifications ---------- */
/** People who messaged you but you haven't accepted yet (and didn't decline since their last message). */
function isRequest(p) {

/* ---------- sounds: louder, with a volume setting and several styles ---------- */

const Float = {
  cur: null,
  open(el, anchor, { sheet = isPhone(), side = 'right', onClose } = {}) {

  close() { if (!this.cur) return; const c = this.cur; this.cur = null; c.el.remove(); c.scrim?.remove(); c.onClose?.(); }

    if (top < m) top = m;
  } else if (side === 'above') {
    left = r.right - w; top = r.top - h - 8;
    if (top < m) top = r.bottom + 8;
    if (top + h > vh - m) top = Math.max(m, vh - h - m);
  } else {
    left = r.right + 10; top = r.top;
    if (left + w > vw - m) left = r.left - w - 10;
    if (left < m) { left = clamp(r.left, m, vw - w - m); top = r.bottom + 8; }
    if (top + h > vh - m) top = vh - h - m;

  const c = Float.cur; if (!c || c.scrim) return;

}, true);

const Modal = {
  stack: [],
  open(html, { cls = '', label = 'Dialog', onClose } = {}) {

    s.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
    s.addEventListener('pointerdown', e => { if (e.target === s) s._down = true; });

      $('#obForm').onsubmit = async e => {

/* =========================================================
   Phone detection, swipe-to-close, long press
   ========================================================= */
function detectPhone() {
  const ua = navigator.userAgent || '';
  const mobileUA = /Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua) || (navigator.userAgentData?.mobile === true);
  const narrow = matchMedia('(max-width: 760px)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const phone = narrow || (mobileUA && coarse && Math.min(screen.width, screen.height) < 600);
  const was = isPhone();
  document.body.classList.toggle('phone', phone);
  if (was !== phone) {
    if (phone && S.active) { document.body.classList.add('chat-open', 'chat-anim'); }
    if (!phone) document.body.classList.remove('chat-open', 'chat-anim', 'dragging');
    Float.close();
  }
}
function setupSwipe() {
  const chat = $('#chat'), side = $('#sidebar'); let d = null, suppress = false;
  chat.addEventListener('pointerdown', e => {
    if (!isPhone() || !chatOpen() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('textarea,input,select,video,audio,pre,.no-swipe,.ac,.tray')) return;
    d = { x: e.clientX, y: e.clientY, id: e.pointerId, on: false, last: e.clientX, lt: e.timeStamp, v: 0, p: 0 };
  });
  chat.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.on) {
      if (dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.25) {
        d.on = true; d.x = e.clientX - 1; document.body.classList.add('dragging'); cancelPress();
        try { chat.setPointerCapture(e.pointerId); } catch {}
        const sel = window.getSelection?.(); if (sel && !sel.isCollapsed) sel.removeAllRanges();
      } else if (Math.abs(dy) > 10 || dx < -10) { d = null; return; }
      else return;
    }
    e.preventDefault();
    const w = chat.offsetWidth, p = clamp(e.clientX - d.x, 0, w);
    const dt = e.timeStamp - d.lt; if (dt > 0) d.v = d.v * .4 + ((e.clientX - d.last) / dt) * .6; d.last = e.clientX; d.lt = e.timeStamp; d.p = p;
    chat.style.transform = `translateX(${p}px)`;
    side.style.transform = `translateX(${-22 * (1 - p / w)}%)`;
    side.style.setProperty('--dim', (.5 + .5 * p / w).toFixed(3));
  });
  const end = e => {
    if (!d || e.pointerId !== d.id) return;
    const g = d; d = null; if (!g.on) return;
    suppress = true; setTimeout(() => suppress = false, 60);
    document.body.classList.remove('dragging');
    chat.style.transform = ''; side.style.transform = ''; side.style.removeProperty('--dim');
    const w = chat.offsetWidth;
    if (g.p > w * .33 || (g.v > .45 && g.p > 24)) closeChat();
  };
  chat.addEventListener('pointerup', end); chat.addEventListener('pointercancel', end);
  chat.addEventListener('lostpointercapture', e => { if (e.target === chat) end(e); });
  chat.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
}
let pressT = null, pressEl = null, pressXY = null, pressFired = false;
function cancelPress() { clearTimeout(pressT); pressT = null; pressEl?.classList.remove('pressing'); pressEl = null; }
function setupLongPress() {
  const box = $('#messages');
  box.addEventListener('pointerdown', e => {
    if (!isPhone() || e.pointerType === 'mouse') return;
    const msg = e.target.closest('.msg'); if (!msg || e.target.closest('a,video,audio,.edit-wrap')) return;
    cancelPress(); pressEl = msg; pressXY = [e.clientX, e.clientY]; pressFired = false;
    pressT = setTimeout(() => { msg.classList.remove('pressing'); pressFired = true; openMsgSheet(msg.dataset.id); pressT = null; pressEl = null; }, 460);
    setTimeout(() => pressT && msg.classList.add('pressing'), 120);
  });
  box.addEventListener('pointermove', e => { if (pressT && pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 8) cancelPress(); });
  ['pointerup', 'pointercancel', 'scroll'].forEach(t => box.addEventListener(t, cancelPress, { passive: true }));
  box.addEventListener('contextmenu', e => { if (isPhone() && e.target.closest('.msg') && !e.target.closest('a,img')) e.preventDefault(); });
  box.addEventListener('click', e => { if (pressFired) { pressFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
}

  $('#attachBtn').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
  $('#emojiBtn').onclick = e => openEmoji(e.currentTarget, em => { insertAtCaret(ta, em.startsWith(':') ? em + ' ' : em); if (!isPhone()) ta.focus(); });
  $('#tray').addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (!r) return; const i = S.pending.findIndex(p => p.id === r.dataset.rm); if (i >= 0) { const [p] = S.pending.splice(i, 1); if (p.thumb) URL.revokeObjectURL(p.thumb); } renderTray(); updateSend(); });
  $('#replyBar').addEventListener('click', e => { if (e.target.closest('[data-act=cancel-reply]')) setReply(null); });

  const box = $('#messages');
  box.addEventListener('scroll', () => { S.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60; }, { passive: true });
  box.addEventListener('click', e => {
    const cb = e.target.closest('[data-callback]'); if (cb) { Calls.start(S.active, cb.dataset.callback); return; }
    const sp = e.target.closest('.spoiler'); if (sp) { sp.classList.toggle('open'); return; }
    const u = e.target.closest('[data-user]'); if (u) { showProfile(u.dataset.user, u); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const msg = el.closest('.msg'), id = msg?.dataset.id, act = el.dataset.act;
    if (act === 'toggle') toggleReact(id, el.dataset.emoji);
    else if (act === 'react-more') openEmoji(el, em => toggleReact(id, em), 'Add reaction');
    else if (act === 'reply') setReply(id);
    else if (act === 'edit') startEdit(id);
    else if (act === 'delete') deleteMsg(id, e.shiftKey);
    else if (act === 'copy') copyMsg(id);
    else if (act === 'view') openViewer(el.dataset.att);
    else if (act === 'jump') jumpTo(el.dataset.to);
    else if (act === 'edit-save') saveEdit();
    else if (act === 'edit-cancel') cancelEdit();
  });
  box.addEventListener('keydown', e => {
    if (e.target.classList?.contains('spoiler') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.classList.toggle('open'); }
    if (!e.target.classList?.contains('edit-box')) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelEdit(); }
  });
  box.addEventListener('input', e => { if (e.target.classList?.contains('edit-box')) S.editDraft = e.target.value; });

  // drag & drop files
  const chat = $('#chat'); let dc = 0;
  chat.addEventListener('dragenter', e => { if (!S.active || ![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); dc++; $('#drop').hidden = false; });
  chat.addEventListener('dragover', e => { if (S.active && [...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
  chat.addEventListener('dragleave', () => { dc = Math.max(0, dc - 1); if (!dc) $('#drop').hidden = true; });
  chat.addEventListener('drop', e => { e.preventDefault(); dc = 0; $('#drop').hidden = true; if (e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (Float.cur) { Float.close(); return; }
      if (Modal.top) { if (SET && Modal.stack.length === 1) tryCloseSettings(); else Modal.close(); return; }
      if (AC.items.length) { hideAC(); return; }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (isPhone() && chatOpen()) closeChat(); $('#search').focus(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.active && (!isPhone() || chatOpen())) { markRead(S.active); renderList(); } });
  window.addEventListener('focus', () => { if (S.active && (!isPhone() || chatOpen())) { markRead(S.active); renderList(); } });
  window.addEventListener('resize', () => { detectPhone(); Float.close(); });
  setInterval(() => { if (S.me) renderList(); }, 60e3);
  setupSwipe(); setupLongPress();
}

/* =========================================================
   Boot
   ========================================================= */
function start(d) {
  loadSnapshot(d);
  $('#onboard').hidden = true; $('#app').hidden = false;
  renderAll(); showEmpty();
  if (S.backend.volatile) toast('This browser is not saving data, so messages will clear when you close the page.', true);
}
function showOffline(base, msg) {
  const ob = $('#onboard'); ob.hidden = false; $('#app').hidden = true;
  ob.innerHTML = `<div class="chat-bg"></div><div class="ob-card"><div class="ob-crest"><svg class="crest" aria-hidden="true"><use href="#crest"/></svg><div><h1>Can't reach the server</h1><p>${esc(msg || 'The server is not answering right now.')}</p></div></div>
    <p class="hint" style="margin:0 0 18px">Your sign-in is kept. Check your internet connection, then try again.</p>
    <button class="btn" style="width:100%;height:46px" id="offRetry">Try again</button>
    <div class="ob-switch"><button type="button" id="offLocal">Use device mode instead</button></div></div>`;
  $('#offRetry').onclick = () => location.reload();
  $('#offLocal').onclick = () => { ls.set('bc.forceLocal', 1); ls.del('bc.server'); location.reload(); };
}
async function sameOriginServer() {
  if (!/^https?:$/.test(location.protocol) || window.Capacitor) return null;
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 1500);
    const r = await fetch('api/ping', { cache: 'no-store', signal: c.signal }); clearTimeout(t);
    if (!r.ok) return null; const j = await r.json();
    return j.app === 'bastion-crossroads' ? location.origin + location.pathname.replace(/\/[^/]*$/, '') : null;
  } catch { return null; }
}
async function boot() {
  applyTheme(S.settings.theme); applyPrefs(); detectPhone(); wire();
  let server = ls.get('bc.server', null);
  const token = ls.get('bc.token', null);
  if (!server && !ls.get('bc.forceLocal', 0)) {
    const so = await sameOriginServer();
    if (so) { server = so; ls.set('bc.server', so); S.fixedServer = true; }
    else if (DEFAULT_SERVER) { server = DEFAULT_SERVER.replace(/\/+$/, ''); S.fixedServer = true; }
  }
  if (server && server === DEFAULT_SERVER.replace(/\/+$/, '')) S.fixedServer = true;
  if (server) {
    if (token) {
      const be = new ServerBackend(server, token); S.backend = be;
      try { const d = await be.init(); return start(d); }
      catch (e) {
        be.close();
        if (!e.auth) return showOffline(server, e.message); // keep the sign-in: the server is just unreachable right now
        ls.del('bc.token'); return showOnboard('server', { base: server, fixed: S.fixedServer, error: e.message });
      }
    }
    try { await wakeServer(server); } catch (e) { return showOffline(server, e.message); }
    return showOnboard('server', { base: server, fixed: S.fixedServer });
  }
  S.backend = new LocalBackend();
  const d = await S.backend.init();
  if (d.needsSetup) return showOnboard('local');
  start(d);
}
boot().catch(e => { console.error(e); document.body.innerHTML = `<div style="padding:40px;font-family:system-ui;color:#eee;background:#151A22;height:100vh">Bastion Crossroads could not start: ${esc(e.message)}</div>`; });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
