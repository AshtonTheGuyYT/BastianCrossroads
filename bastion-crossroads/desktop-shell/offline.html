<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bastion Crossroads</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#151A22;color:#ECE6D8;font:16px "Segoe UI",system-ui,sans-serif;text-align:center}
div{max-width:380px;padding:28px}
svg{width:64px;height:72px}
h1{font-size:23px;margin:18px 0 8px;font-weight:600}
p{color:#97A1AE;margin:0 0 24px;line-height:1.5}
button{background:#E9B44C;color:#1D1404;font:700 15px "Segoe UI",system-ui,sans-serif;border:0;border-radius:10px;padding:12px 28px;cursor:pointer}
button:hover{filter:brightness(1.08)}
small{display:block;margin-top:16px;color:#6F7A88}
</style></head>
<body><div>
<svg viewBox="0 0 64 72" aria-hidden="true"><path fill="#E9B44C" d="M6 4h10v6h7V4h7v6h4V4h7v6h7V4h10v32c0 16-11.5 27-26 32C17.5 63 6 52 6 36z"/><path fill="#151A22" d="M28 14h8v50.5l-4 1.7-4-1.7zM11 30h42v8H11z"/><circle cx="32" cy="34" r="6.5" fill="#E9B44C"/><circle cx="32" cy="34" r="2.5" fill="#151A22"/></svg>
<h1>Can't reach Bastion Crossroads</h1>
<p>Check your internet connection. If the server was asleep, it can take up to a minute to wake up.</p>
<button id="retry">Try again</button>
<small id="auto">Trying again automatically…</small>
</div>
<script>
const server = new URLSearchParams(location.search).get('server') || 'https://bastion-crossroads.onrender.com/';
const go = () => { location.href = server; };
document.getElementById('retry').onclick = go;
let n = 20; const t = document.getElementById('auto');
setInterval(() => { n--; if (n <= 0) go(); else t.textContent = `Trying again in ${n} seconds…`; }, 1000);
</script>
</body></html>
